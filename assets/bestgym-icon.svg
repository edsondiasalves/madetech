<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGym" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="barbellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="gymGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="154" height="154" x="3" y="3" rx="40" fill="url(#bgGym)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>

  <!-- Icon Graphic: Pin + Barbell -->
  <g filter="url(#gymGlow)">
    <!-- Location Pin Backdrop -->
    <path d="M 80 24 C 58 24 40 42 40 64 C 40 92 80 134 80 134 C 80 134 120 92 120 64 C 120 42 102 24 80 24 Z" fill="url(#pinGrad)" opacity="0.85"/>
    <circle cx="80" cy="62" r="24" fill="#0f172a" opacity="0.9"/>

    <!-- Barbell Graphic -->
    <!-- Center Bar -->
    <rect x="46" y="58" width="68" height="8" rx="4" fill="#ffffff"/>
    
    <!-- Outer Left Weights -->
    <rect x="42" y="44" width="8" height="36" rx="3" fill="url(#barbellGrad)"/>
    <rect x="52" y="48" width="6" height="28" rx="2" fill="#ffffff"/>
    
    <!-- Outer Right Weights -->
    <rect x="110" y="44" width="8" height="36" rx="3" fill="url(#barbellGrad)"/>
    <rect x="102" y="48" width="6" height="28" rx="2" fill="#ffffff"/>
  </g>
</svg>
