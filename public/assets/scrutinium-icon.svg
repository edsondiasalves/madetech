<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPoll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#31104b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <linearGradient id="barAGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>

    <linearGradient id="barBGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="pollGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="154" height="154" x="3" y="3" rx="40" fill="url(#bgPoll)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>

  <!-- Icon Graphic: Speech Bubble with Voting Bars -->
  <g filter="url(#pollGlow)">
    <!-- Speech Bubble Outline -->
    <path d="M 32 38 C 32 28 42 18 56 18 L 104 18 C 118 18 128 28 128 38 L 128 94 C 128 104 118 114 104 114 L 68 114 L 46 134 L 48 114 L 32 114 Z" fill="rgba(255, 255, 255, 0.08)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3"/>

    <!-- Bar A (Tall Winner Bar with Checkmark) -->
    <rect x="52" y="44" width="22" height="56" rx="6" fill="url(#barAGrad)"/>
    <path d="M 57 72 L 62 77 L 70 65" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Bar B (Shorter Bar) -->
    <rect x="86" y="62" width="22" height="38" rx="6" fill="url(#barBGrad)"/>

    <!-- Option Labels inside Bars -->
    <text x="63" y="94" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">A</text>
    <text x="97" y="94" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
  </g>
</svg>
